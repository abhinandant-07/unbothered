<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Content-Type"
        content="text/html; charset=UTF-8"
    >

    <title>Unbothered</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #0b0b0b;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            padding-bottom: 100px;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            background: #050505;
            padding: 28px 16px;
            overflow-y: auto;
            z-index: 10;
        }

        .logo {
            padding: 0 14px;
            margin-bottom: 35px;
        }

        .logo-symbol {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -1px;
        }

        .nav-section {
            margin-bottom: 28px;
        }

        .nav-title {
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
            margin: 0 14px 10px;
            letter-spacing: 1px;
        }

        .nav-link {
            width: 100%;
            border: 0;
            background: transparent;
            color: #bbbbbb;
            padding: 13px 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #1c1c1c;
            color: #ffffff;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 260px;
            padding: 18px 30px 120px;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 35px;
        }

        .top-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 0;
            background: #1d1d1d;
            color: white;
            font-size: 18px;
        }

        .top-button:hover {
            background: #292929;
        }

        .search-box {
            width: min(500px, 100%);
            position: relative;
        }

        .search-box input {
            width: 100%;
            border: 0;
            outline: none;
            border-radius: 25px;
            padding: 14px 20px;
            background: #202020;
            color: white;
            font-size: 15px;
        }

        .search-box input::placeholder {
            color: #888;
        }

        .profile {
            margin-left: auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #292929;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* =========================
           HERO
        ========================= */

        .hero h2 {
            font-size: 38px;
            margin: 0 0 12px;
        }

        .hero p {
            color: #aaa;
            margin: 0 0 35px;
            font-size: 16px;
        }

        /* =========================
           QUICK ACCESS
        ========================= */

        .section-title {
            font-size: 24px;
            margin: 0 0 18px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 40px;
        }

        .quick-card {
            border: 0;
            background: #202020;
            color: white;
            border-radius: 10px;
            padding: 22px;
            text-align: left;
            min-height: 80px;
            font-weight: bold;
        }

        .quick-card:hover {
            background: #292929;
        }

        /* =========================
           SONGS
        ========================= */

        .songs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .song-count {
            color: #888;
            font-size: 14px;
        }

        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .song {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            min-height: 70px;
        }

        .song:hover {
            background: #1d1d1d;
        }

        .song-number {
            width: 25px;
            color: #777;
            text-align: center;
            flex-shrink: 0;
        }

        .cover {
            width: 52px;
            height: 52px;
            border-radius: 5px;
            background: #292929;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 20px;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-info {
            min-width: 0;
            flex: 1;
        }

        .song-title {
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: #999;
            margin-top: 5px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-play {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 0;
            background: white;
            color: black;
            font-size: 17px;
            flex-shrink: 0;
        }

        .song-play:hover {
            transform: scale(1.05);
        }

        .empty {
            color: #777;
            padding: 40px 0;
            text-align: center;
        }

        /* =========================
           PLAYER
        ========================= */

        .player {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 92px;
            background: rgba(15, 15, 15, 0.98);
            border-top: 1px solid #292929;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            gap: 20px;
        }

        .player-song {
            width: 260px;
            min-width: 180px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-cover {
            width: 55px;
            height: 55px;
            border-radius: 5px;
            background: #292929;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-info {
            min-width: 0;
        }

        .player-title {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        .controls {
            flex: 1;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .control-button {
            border: 0;
            background: transparent;
            color: white;
            font-size: 18px;
            width: 35px;
            height: 35px;
        }

        .control-button:hover {
            color: #cccccc;
        }

        .play-main {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 0;
            background: white;
            color: black;
            font-size: 17px;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time {
            width: 40px;
            color: #888;
            font-size: 11px;
            text-align: center;
        }

        .progress {
            flex: 1;
            height: 4px;
            accent-color: white;
            cursor: pointer;
        }

        .volume-area {
            width: 180px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume {
            flex: 1;
            accent-color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
                padding-left: 20px;
                padding-right: 20px;
            }

            .quick-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .player-song {
                width: 200px;
            }

            .volume-area {
                width: 120px;
            }
        }

        @media (max-width: 650px) {

            body {
                padding-bottom: 150px;
            }

            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                padding: 15px;
            }

            .logo {
                margin-bottom: 15px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .nav-section {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                margin-bottom: 10px;
            }

            .nav-title {
                width: 100%;
            }

            .nav-link {
                width: auto;
            }

            .main {
                margin-left: 0;
                padding: 15px 15px 160px;
            }

            .topbar {
                flex-wrap: wrap;
            }

            .search-box {
                order: 3;
                width: 100%;
            }

            .hero h2 {
                font-size: 30px;
            }

            .quick-grid {
                grid-template-columns: 1fr;
            }

            .song {
                padding: 9px 4px;
            }

            .song-number {
                display: none;
            }

            .player {
                height: 145px;
                padding: 10px 15px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .player-song {
                width: 100%;
                height: 55px;
            }

            .controls {
                width: 100%;
                max-width: none;
                order: 2;
            }

            .volume-area {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-symbol">
                U
            </div>

            <h1>Unbothered</h1>

        </div>

        <div class="nav-section">

            <button class="nav-link active" onclick="showHome()">
                Home
            </button>

            <button class="nav-link" onclick="focusSearch()">
                Search
            </button>

            <button class="nav-link" onclick="showAllSongs()">
                Your Library
            </button>

        </div>

        <div class="nav-section">

            <div class="nav-title">
                Your Music
            </div>

            <button class="nav-link" onclick="showAllSongs()">
                Liked Songs
            </button>

            <button class="nav-link" onclick="showAllSongs()">
                Recently Played
            </button>

            <button class="nav-link">
                Downloads
            </button>

            <button
                class="nav-link"
                onclick="window.location.href='admin.html'"
            >
                Add Song
            </button>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <div class="topbar">

            <button
                class="top-button"
                onclick="history.back()"
                title="Go back"
            >
                ←
            </button>

            <button
                class="top-button"
                onclick="history.forward()"
                title="Go forward"
            >
                →
            </button>

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search songs or artists..."
                    autocomplete="off"
                >

            </div>

            <div class="profile">
                U
            </div>

        </div>


        <section class="hero">

            <h2>
                Welcome to Unbothered
            </h2>

            <p>
                Your music. Your space. No distractions.
            </p>

        </section>


        <!-- QUICK ACCESS -->

        <section>

            <h2 class="section-title">
                Quick Access
            </h2>

            <div class="quick-grid">

                <button
                    class="quick-card"
                    onclick="filterSongs('chill')"
                >
                    Chill
                </button>

                <button
                    class="quick-card"
                    onclick="filterSongs('focus')"
                >
                    Focus
                </button>

                <button
                    class="quick-card"
                    onclick="filterSongs('energy')"
                >
                    Energy
                </button>

                <button
                    class="quick-card"
                    onclick="filterSongs('sleep')"
                >
                    Sleep
                </button>

            </div>

        </section>


        <!-- SONG LIST -->

        <section>

            <div class="songs-header">

                <h2 class="section-title">
                    Your Music
                </h2>

                <div
                    class="song-count"
                    id="songCount"
                >
                    0 songs
                </div>

            </div>

            <div
                class="songs-list"
                id="songsList"
            >

                <div class="empty">
                    Loading songs...
                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         PLAYER
    ========================= -->

    <div class="player">

        <div class="player-song">

            <div
                class="player-cover"
                id="playerCover"
            >
                ♪
            </div>

            <div class="player-info">

                <div
                    class="player-title"
                    id="playerTitle"
                >
                    Nothing playing
                </div>

                <div
                    class="player-artist"
                    id="playerArtist"
                >
                    Choose a song
                </div>

            </div>

        </div>


        <div class="controls">

            <div class="control-buttons">

                <button
                    class="control-button"
                    onclick="previousSong()"
                    title="Previous song"
                >
                    ⏮
                </button>

                <button
                    class="play-main"
                    id="mainPlayButton"
                    onclick="togglePlay()"
                    title="Play"
                >
                    ▶
                </button>

                <button
                    class="control-button"
                    onclick="nextSong()"
                    title="Next song"
                >
                    ⏭
                </button>

            </div>


            <div class="progress-row">

                <span
                    class="time"
                    id="currentTime"
                >
                    0:00
                </span>

                <input
                    type="range"
                    class="progress"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                >

                <span
                    class="time"
                    id="duration"
                >
                    0:00
                </span>

            </div>

        </div>


        <div class="volume-area">

            <span>
                🔊
            </span>

            <input
                type="range"
                class="volume"
                id="volume"
                min="0"
                max="1"
                value="1"
                step="0.01"
            >

        </div>

    </div>


    <!-- REAL AUDIO PLAYER -->

    <audio
        id="audioPlayer"
        preload="metadata"
    ></audio>


    <script>

        /* =========================================
           GLOBAL VARIABLES
        ========================================= */

        let songs = [];

        let filteredSongs = [];

        let currentIndex = -1;

        const audioPlayer =
            document.getElementById("audioPlayer");

        const songsList =
            document.getElementById("songsList");

        const searchInput =
            document.getElementById("searchInput");

        const progress =
            document.getElementById("progress");

        const volume =
            document.getElementById("volume");

        const currentTime =
            document.getElementById("currentTime");

        const duration =
            document.getElementById("duration");

        const mainPlayButton =
            document.getElementById("mainPlayButton");

        const playerTitle =
            document.getElementById("playerTitle");

        const playerArtist =
            document.getElementById("playerArtist");

        const playerCover =
            document.getElementById("playerCover");

        const songCount =
            document.getElementById("songCount");


        /* =========================================
           LOAD SONGS
        ========================================= */

        async function loadSongs() {

            try {

                songsList.innerHTML =
                    '<div class="empty">Loading songs...</div>';

                const response =
                    await fetch("/api/songs");

                if (!response.ok) {

                    throw new Error(
                        "Failed to load songs"
                    );
                }

                const data =
                    await response.json();

                if (!Array.isArray(data)) {

                    throw new Error(
                        "Invalid songs data"
                    );
                }

                songs = data;

                filteredSongs = [...songs];

                renderSongs();

            } catch (error) {

                console.error(
                    "LOAD SONGS ERROR:",
                    error
                );

                songsList.innerHTML = `
                    <div class="empty">
                        Could not load songs.
                        Please refresh the page.
                    </div>
                `;

            }

        }


        /* =========================================
           RENDER SONGS
        ========================================= */

        function renderSongs() {

            songsList.innerHTML = "";

            songCount.textContent =
                `${filteredSongs.length} ${
                    filteredSongs.length === 1
                        ? "song"
                        : "songs"
                }`;

            if (filteredSongs.length === 0) {

                songsList.innerHTML = `
                    <div class="empty">
                        No songs found.
                    </div>
                `;

                return;
            }


            filteredSongs.forEach(
                (song, index) => {

                    const row =
                        document.createElement("div");

                    row.className = "song";


                    /* NUMBER */

                    const number =
                        document.createElement("div");

                    number.className =
                        "song-number";

                    number.textContent =
                        index + 1;


                    /* COVER */

                    const cover =
                        document.createElement("div");

                    cover.className =
                        "cover";

                    if (song.cover_url) {

                        const image =
                            document.createElement("img");

                        image.src =
                            song.cover_url;

                        image.alt =
                            song.title || "Song cover";

                        image.onerror =
                            function () {

                                this.style.display =
                                    "none";

                                cover.textContent =
                                    "♪";
                            };

                        cover.appendChild(image);

                    } else {

                        cover.textContent = "♪";

                    }


                    /* SONG INFO */

                    const info =
                        document.createElement("div");

                    info.className =
                        "song-info";


                    const title =
                        document.createElement("div");

                    title.className =
                        "song-title";

                    title.textContent =
                        song.title || "Unknown title";


                    const artist =
                        document.createElement("div");

                    artist.className =
                        "song-artist";

                    artist.textContent =
                        song.artist || "Unknown artist";


                    info.appendChild(title);
                    info.appendChild(artist);


                    /* PLAY BUTTON */

                    const playButton =
                        document.createElement("button");

                    playButton.className =
                        "song-play";

                    playButton.textContent =
                        "▶";

                    playButton.title =
                        "Play " +
                        (song.title || "song");


                    playButton.addEventListener(
                        "click",
                        function () {

                            playSong(index);

                        }
                    );


                    row.appendChild(number);
                    row.appendChild(cover);
                    row.appendChild(info);
                    row.appendChild(playButton);

                    songsList.appendChild(row);

                }
            );

        }


        /* =========================================
           PLAY SONG
        ========================================= */

        async function playSong(index) {

            if (
                index < 0 ||
                index >= filteredSongs.length
            ) {
                return;
            }


            const song =
                filteredSongs[index];

            if (!song.audio_url) {

                alert(
                    "This song does not have an audio file."
                );

                return;
            }


            currentIndex = index;


            console.log(
                "Playing:",
                song.title
            );

            console.log(
                "Audio URL:",
                song.audio_url
            );


            /*
             * IMPORTANT:
             * Set the actual Supabase public URL
             * as the audio source.
             */

            audioPlayer.src =
                song.audio_url;

            audioPlayer.load();


            playerTitle.textContent =
                song.title || "Unknown title";

            playerArtist.textContent =
                song.artist || "Unknown artist";


            playerCover.innerHTML = "";


            if (song.cover_url) {

                const image =
                    document.createElement("img");

                image.src =
                    song.cover_url;

                image.alt =
                    song.title || "Cover";

                image.onerror =
                    function () {

                        playerCover.innerHTML =
                            "♪";
                    };

                playerCover.appendChild(image);

            } else {

                playerCover.textContent =
                    "♪";

            }


            try {

                await audioPlayer.play();

                mainPlayButton.textContent =
                    "⏸";

            } catch (error) {

                console.error(
                    "AUDIO PLAY ERROR:",
                    error
                );

                alert(
                    "The song could not be played. Check the audio file URL and Supabase Storage permissions."
                );

                mainPlayButton.textContent =
                    "▶";
            }

        }


        /* =========================================
           PLAY / PAUSE
        ========================================= */

        async function togglePlay() {

            if (!audioPlayer.src) {

                if (filteredSongs.length > 0) {

                    await playSong(0);

                }

                return;
            }


            if (audioPlayer.paused) {

                try {

                    await audioPlayer.play();

                    mainPlayButton.textContent =
                        "⏸";

                } catch (error) {

                    console.error(
                        "PLAY ERROR:",
                        error
                    );

                }

            } else {

                audioPlayer.pause();

                mainPlayButton.textContent =
                    "▶";

            }

        }


        /* =========================================
           PREVIOUS SONG
        ========================================= */

        function previousSong() {

            if (filteredSongs.length === 0) {
                return;
            }

            if (currentIndex <= 0) {

                playSong(
                    filteredSongs.length - 1
                );

            } else {

                playSong(
                    currentIndex - 1
                );

            }

        }


        /* =========================================
           NEXT SONG
        ========================================= */

        function nextSong() {

            if (filteredSongs.length === 0) {
                return;
            }

            if (
                currentIndex >=
                filteredSongs.length - 1
            ) {

                playSong(0);

            } else {

                playSong(
                    currentIndex + 1
                );

            }

        }


        /* =========================================
           AUDIO EVENTS
        ========================================= */

        audioPlayer.addEventListener(
            "loadedmetadata",
            function () {

                if (
                    Number.isFinite(
                        audioPlayer.duration
                    )
                ) {

                    duration.textContent =
                        formatTime(
                            audioPlayer.duration
                        );

                }

            }
        );


        audioPlayer.addEventListener(
            "timeupdate",
            function () {

                if (
                    Number.isFinite(
                        audioPlayer.duration
                    ) &&
                    audioPlayer.duration > 0
                ) {

                    progress.value =
                        (
                            audioPlayer.currentTime /
                            audioPlayer.duration
                        ) * 100;

                }

                currentTime.textContent =
                    formatTime(
                        audioPlayer.currentTime
                    );

            }
        );


        audioPlayer.addEventListener(
            "play",
            function () {

                mainPlayButton.textContent =
                    "⏸";

            }
        );


        audioPlayer.addEventListener(
            "pause",
            function () {

                mainPlayButton.textContent =
                    "▶";

            }
        );


        audioPlayer.addEventListener(
            "ended",
            function () {

                nextSong();

            }
        );


        audioPlayer.addEventListener(
            "error",
            function () {

                console.error(
                    "Audio element error:",
                    audioPlayer.error
                );

                mainPlayButton.textContent =
                    "▶";

            }
        );


        /* =========================================
           PROGRESS BAR
        ========================================= */

        progress.addEventListener(
            "input",
            function () {

                if (
                    Number.isFinite(
                        audioPlayer.duration
                    )
                ) {

                    audioPlayer.currentTime =
                        (
                            Number(progress.value) /
                            100
                        ) *
                        audioPlayer.duration;

                }

            }
        );


        /* =========================================
           VOLUME
        ========================================= */

        volume.addEventListener(
            "input",
            function () {

                audioPlayer.volume =
                    Number(volume.value);

            }
        );


        /* =========================================
           SEARCH
        ========================================= */

        searchInput.addEventListener(
            "input",
            function () {

                const query =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!query) {

                    filteredSongs =
                        [...songs];

                } else {

                    filteredSongs =
                        songs.filter(
                            song => {

                                const title =
                                    (
                                        song.title || ""
                                    ).toLowerCase();

                                const artist =
                                    (
                                        song.artist || ""
                                    ).toLowerCase();

                                return (
                                    title.includes(query) ||
                                    artist.includes(query)
                                );

                            }
                        );

                }

                currentIndex = -1;

                renderSongs();

            }
        );


        /* =========================================
           FILTER
        ========================================= */

        function filterSongs(type) {

            const query =
                type.toLowerCase();

            filteredSongs =
                songs.filter(
                    song => {

                        const title =
                            (
                                song.title || ""
                            ).toLowerCase();

                        const artist =
                            (
                                song.artist || ""
                            ).toLowerCase();

                        return (
                            title.includes(query) ||
                            artist.includes(query)
                        );

                    }
                );

            renderSongs();

        }


        /* =========================================
           SHOW ALL SONGS
        ========================================= */

        function showAllSongs() {

            searchInput.value = "";

            filteredSongs =
                [...songs];

            renderSongs();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =========================================
           HOME
        ========================================= */

        function showHome() {

            searchInput.value = "";

            filteredSongs =
                [...songs];

            renderSongs();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =========================================
           SEARCH FOCUS
        ========================================= */

        function focusSearch() {

            searchInput.focus();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =========================================
           TIME FORMAT
        ========================================= */

        function formatTime(seconds) {

            if (
                !Number.isFinite(seconds) ||
                seconds < 0
            ) {
                return "0:00";
            }


            const minutes =
                Math.floor(seconds / 60);

            const remainingSeconds =
                Math.floor(seconds % 60);


            return (
                minutes +
                ":" +
                String(
                    remainingSeconds
                ).padStart(2, "0")
            );

        }


        /* =========================================
           KEYBOARD SHORTCUTS
        ========================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.code === "Space" &&
                    document.activeElement !== searchInput
                ) {

                    event.preventDefault();

                    togglePlay();

                }

            }
        );


        /* =========================================
           START
        ========================================= */

        loadSongs();

    </script>

</body>
</html>
